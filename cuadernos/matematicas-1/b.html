    var NOMBRE = "llave-" + SAL;
    var forma = document.getElementById("acceso"), entrar = document.getElementById("entrar"), aviso = document.getElementById("aviso");

    function bytes(b) { return Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); }); }
    function leer() { try { return sessionStorage.getItem(NOMBRE); } catch (e) { return null; } }
    function guardar(v) { try { if (v) { sessionStorage.setItem(NOMBRE, v); } else { sessionStorage.removeItem(NOMBRE); } } catch (e) {} }

    function abrir(crudo) {
      var iv = bytes(IV), texto = bytes(TEXTO), junto = new Uint8Array(iv.length + texto.length);
      junto.set(iv); junto.set(texto, iv.length);
      return crypto.subtle.importKey("raw", crudo.slice(32), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]).then(function (llaveSello) {
        return crypto.subtle.verify("HMAC", llaveSello, bytes(SELLO), junto);
      }).then(function (correcta) {
        if (!correcta) { throw new Error("incorrecta"); }
        return crypto.subtle.importKey("raw", crudo.slice(0, 32), "AES-CBC", false, ["decrypt"]);
      }).then(function (llave) {
        return crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, llave, texto);
      }).then(function (claro) {
        var html = new TextDecoder().decode(claro);
        document.open(); document.write(html); document.close();
      });
    }

    function pedir() { forma.hidden = false; document.getElementById("clave").focus(); }

    if (!window.crypto || !crypto.subtle) {
      forma.hidden = false; entrar.disabled = true;
      aviso.textContent = "Este navegador no puede abrir la página desde aquí. Ábrela desde internet.";
      return;
    }

    forma.addEventListener("submit", function (ev) {
      ev.preventDefault();
      entrar.disabled = true; aviso.textContent = "Abriendo...";
      var texto = new TextEncoder().encode(document.getElementById("clave").value);
      crypto.subtle.importKey("raw", texto, "PBKDF2", false, ["deriveBits"]).then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: bytes(SAL), iterations: VUELTAS }, base, 512);
      }).then(function (bits) {
        var crudo = new Uint8Array(bits);
        return abrir(crudo).then(function () { guardar(btoa(String.fromCharCode.apply(null, crudo))); });
      }).catch(function () {
        entrar.disabled = false; aviso.textContent = "Contraseña incorrecta.";
      });
    });

    // Mientras la pestaña siga abierta no se vuelve a pedir al cambiar de versión.
    window.addEventListener("load", function () {
      var guardada = leer();
      if (guardada) { abrir(bytes(guardada)).catch(function () { guardar(null); pedir(); }); } else { pedir(); }
    });
  })();
